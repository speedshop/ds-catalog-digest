name: Catalog repair setup check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check existing Codex credentials without inference
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          codex = os.environ.get("CODEX_API_KEY", "")
          openai = os.environ.get("OPENAI_API_KEY", "")
          report = {"codexSecretConfigured": bool(codex), "openaiSecretConfigured": bool(openai), "inferenceRequests": 0, "model": "gpt-5.6-luna"}
          key = codex or openai
          if key:
              request = Request("https://api.openai.com/v1/models/gpt-5.6-luna", headers={"Authorization": "Bearer " + key})
              try:
                  with urlopen(request, timeout=20) as response:
                      report["modelMetadataStatus"] = response.status
              except HTTPError as error:
                  report["modelMetadataStatus"] = error.code
              except URLError:
                  report["modelMetadataStatus"] = "unreachable"
          print(json.dumps(report, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Zero-inference Codex setup probe\n\n```json\n" + json.dumps(report, indent=2) + "\n```\n")
          PY
