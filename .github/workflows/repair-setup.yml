name: Catalog repair setup check

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check GitHub-billed model access without inference
        env:
          GH_TOKEN: ${{ github.token }}
          DMS_CONFIGURED: ${{ secrets.DMS_CHECK_IN_URL != '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          request = Request("https://api.githubcopilot.com/models", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/json", "Copilot-Integration-Id": "copilot-cli", "Editor-Version": "vscode/1.99.0", "Editor-Plugin-Version": "copilot-chat/0.26.0"})
          report = {"dmsSecretConfigured": os.environ["DMS_CONFIGURED"] == "true", "inferenceRequests": 0}
          try:
              with urlopen(request, timeout=30) as response:
                  data = json.load(response)
                  report["modelCatalogStatus"] = response.status
                  report["lunaModels"] = [model["id"] for model in data.get("data", []) if "luna" in model.get("id", "").lower()]
          except HTTPError as error:
              report["modelCatalogStatus"] = error.code
              try:
                  failure = json.load(error)
                  report["catalogError"] = str(failure.get("message", failure.get("error", "No structured error")))[:500].replace(os.environ["GH_TOKEN"], "[redacted]")
              except (ValueError, AttributeError):
                  report["catalogError"] = "No structured error"
              report["lunaModels"] = []
          print(json.dumps(report, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Zero-inference repair setup probe\n\n```json\n" + json.dumps(report, indent=2) + "\n```\n")
          PY
      - name: Set up native Copilot CLI diagnostics
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Discover native CLI model options without inference
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install --global @github/copilot@1.0.80
          copilot --version
          copilot --help > /tmp/copilot-help.txt
          grep -A 8 -B 2 -- "--model" /tmp/copilot-help.txt || true
      - name: Native model catalog without inference
        timeout-minutes: 2
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/copilot-model-probe
          cd /tmp/copilot-model-probe
          VERSION=$(npm view @github/copilot-sdk version)
          npm install --save-exact "@github/copilot-sdk@$VERSION"
          cat > probe.mjs <<'JS'
          import { CopilotClient } from "@github/copilot-sdk";
          const client = new CopilotClient({ cliPath: "/usr/local/bin/copilot", useStdio: true, logLevel: "error" });
          const timer = setTimeout(() => process.exit(2), 60000);
          try {
            await client.start();
            const models = await client.listModels();
            console.log(JSON.stringify({ nativeModelCatalog: "ok", inferenceRequests: 0, lunaModels: models.filter(x => /luna/i.test(x.id)).map(x => ({ id: x.id, name: x.name, billing: x.billing })) }));
          } catch (error) {
            console.log(JSON.stringify({ nativeModelCatalog: "error", inferenceRequests: 0, message: String(error.message).replaceAll(process.env.COPILOT_GITHUB_TOKEN, "[redacted]").slice(0, 1000) }));
            process.exitCode = 1;
          } finally {
            await client.stop();
            clearTimeout(timer);
          }
          JS
          node probe.mjs
