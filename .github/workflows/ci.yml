name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests && python tests/system_maintenance.py && python tests/system_incidents.py && python tests/system_publication.py && python tests/system_heartbeat.py
      - name: Check public-source boundary
        run: python scripts/check_forbidden_source.py
      - name: Validate committed catalog
        run: python scripts/validate_catalog.py catalog/model-selection-catalog.json schema/model-metrics-catalog.schema.json

  catalog-contract-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out canonical consumer contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: speedshop/pi-pareto-model
          ref: 04e7446f4fd3eada7151a19e25d97203d2a961de
          path: canonical-consumer
          persist-credentials: false
          sparse-checkout: /schema/model-metrics-catalog.schema.json
          sparse-checkout-cone-mode: false
      - name: Verify canonical catalog schema
        run: cmp --silent schema/model-metrics-catalog.schema.json canonical-consumer/schema/model-metrics-catalog.schema.json
