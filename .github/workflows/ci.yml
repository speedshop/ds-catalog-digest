name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts

      - name: Test
        run: python -m unittest discover -s tests

      - name: Validate published catalog
        run: |
          python scripts/validate_catalog.py \
            catalog/model-selection-catalog.json \
            schema/model-selection-catalog.schema.json

  catalog-contract-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out canonical catalog contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: speedshop/pi-pareto-model
          ref: b8cee5aaf8b9a07b67be9fb8a650d80cb17530b9
          path: canonical/pi-pareto-model
          persist-credentials: false

      - name: Check vendored catalog contract
        run: |
          cmp --silent schema/model-selection-catalog.schema.json \
            canonical/pi-pareto-model/schema/model-selection-catalog.schema.json
