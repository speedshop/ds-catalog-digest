name: Publish catalog digest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: publish-catalog-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up gitleaks
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.8.10"
          install_args: gitleaks

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts

      - name: Test
        run: python -m unittest discover -s tests

      - name: Check public-source boundary
        run: python scripts/check_forbidden_source.py

      - name: Export Pi Provider Routes
        run: node scripts/export_pi_catalog.mjs --output dist/pi-model-catalog.json

      - name: Build catalog and route artifacts
        run: python scripts/build_catalog.py --output-dir dist --pi-catalog dist/pi-model-catalog.json

      - name: Check generated public-source boundary
        run: python scripts/check_forbidden_source.py

      - name: Validate published contract
        run: python scripts/validate_catalog.py dist/model-selection-catalog.json dist/schema.json

      - name: Scan generated artifacts for secrets
        run: mise exec -- gitleaks dir --redact=75 --no-banner --no-color --max-target-megabytes 5 dist

      - name: Upload diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ds-catalog-digest-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload candidate queue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-candidates-${{ github.run_id }}
          path: dist/route-candidates.json
          if-no-files-found: error
          retention-days: 7

  notify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download candidate queue
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: route-candidates-${{ github.run_id }}
          path: dist

      - name: Synchronize managed candidate issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_candidate_issues.py dist/route-candidates.json

  publish:
    needs: [build, notify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ds-catalog-digest-${{ github.run_id }}
          path: dist

      - name: Update stable artifacts
        run: |
          cp dist/model-selection-catalog.json catalog/model-selection-catalog.json
          cp dist/model-aliases.json mappings/model-aliases.json
          cp dist/ALIAS_AUDIT.md mappings/ALIAS_AUDIT.md
          cp dist/pi-model-catalog.json mappings/pi-model-catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/model-selection-catalog.json mappings/model-aliases.json mappings/ALIAS_AUDIT.md mappings/pi-model-catalog.json
          git diff --cached --quiet || git commit --no-gpg-sign -m "Update catalog and Pi Provider Routes"
          git push
