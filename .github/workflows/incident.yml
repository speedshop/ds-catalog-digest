name: Catalog maintenance incidents

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Publish catalog digest, Verify catalog repair]
    types: [completed]
    branches: [main]

concurrency:
  group: catalog-maintenance-incidents
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Dispatch bounded repair or escalate exhausted attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_incident.py
