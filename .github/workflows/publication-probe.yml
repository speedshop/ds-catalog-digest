name: Publication pipeline probe

on:
  workflow_dispatch:

concurrency:
  group: publish-catalog-digest
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate a non-semantic change and invoke the production publisher
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          source = Path("catalog/model-selection-catalog.json").read_bytes()
          candidate = source + b"\n"
          assert json.loads(source) == json.loads(candidate)
          (dist / "model-selection-catalog.json").write_bytes(candidate)
          manifest = Path("catalog/source-manifest.json")
          if manifest.exists():
              (dist / "source-manifest.json").write_bytes(manifest.read_bytes())
          subprocess.run(["python", "scripts/validate_catalog.py", str(dist / "model-selection-catalog.json"), "schema/model-metrics-catalog.schema.json"], check=True)
          workflow = Path(".github/workflows/publish.yml").read_text()
          block = workflow.rsplit("        run: |\n", 1)[1]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          subprocess.run(["bash", "-e", "-c", script], check=True)
          PY
