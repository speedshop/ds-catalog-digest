[tools]
python = "3.13"
hk = "1.39.0"
gitleaks = "8.30.1"

[env]
_.file = ".env"

[tasks.install]
description = "Install dependencies"
run = "python -m pip install -r requirements.txt"

[tasks.test]
description = "Run the test suite"
sources = ["scripts/**/*.py", "tests/**/*.py", "tests/fixtures/**/*", "schema/**/*", "sources/**/*", "catalog/*.json", ".github/workflows/*.yml"]
run = "python -m unittest discover -s tests && python tests/system_maintenance.py && python tests/system_incidents.py && python tests/system_publication.py && python tests/system_heartbeat.py"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint:python", "lint:json", "lint:forbidden-source", "lint:secrets"]

[tasks."lint:python"]
description = "Compile Python sources"
run = "python -m compileall -q scripts tests"

[tasks."lint:json"]
description = "Validate JSON files"
run = "python scripts/lint_json.py"

[tasks."lint:forbidden-source"]
description = "Prevent restricted-source names and identifiers"
run = "python scripts/check_forbidden_source.py"

[tasks."lint:secrets"]
description = "Scan working tree for hardcoded secrets"
run = "gitleaks dir --redact=100 --no-banner --no-color --max-target-megabytes 5 ."

[tasks.build]
description = "Build and validate the public metrics catalog"
run = "python scripts/build_catalog.py --output-dir dist && python scripts/validate_catalog.py dist/model-selection-catalog.json dist/schema.json"
