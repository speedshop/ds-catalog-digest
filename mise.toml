[tools]
python = "3.13"
node = "22.22.3"
hk = "1.39.0"
gitleaks = "8.30.1"

[env]
_.file = ".env"

[tasks.install]
description = "Install dependencies"
run = "python -m pip install -r requirements.txt && npm ci --ignore-scripts"

[tasks.test]
description = "Run the test suite"
sources = ["scripts/**/*.py", "tests/**/*.py", "tests/fixtures/**/*", "schema/**/*", "sources/**/*"]
run = "python -m unittest discover -s tests"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint:python", "lint:javascript", "lint:json", "lint:forbidden-source", "lint:secrets"]

[tasks."lint:python"]
description = "Compile Python sources"
sources = ["scripts/**/*.py", "tests/**/*.py"]
run = "python -m compileall -q scripts tests"

[tasks."lint:javascript"]
description = "Parse JavaScript sources"
sources = ["scripts/**/*.mjs"]
run = "node --check scripts/export_pi_catalog.mjs"

[tasks."lint:json"]
description = "Validate JSON files"
sources = ["schema/**/*.json", "sources/**/*.json", "mappings/**/*.json", "pi-catalog/**/*.json", "package*.json"]
run = "python scripts/lint_json.py"

[tasks."lint:forbidden-source"]
description = "Prevent restricted-source names and identifiers"
run = "python scripts/check_forbidden_source.py"

[tasks."lint:secrets"]
description = "Scan working tree for hardcoded secrets"
run = "gitleaks dir --redact=75 --no-banner --no-color --max-target-megabytes 5 ."

[tasks."catalog:export"]
description = "Export the current pinned Pi Provider Route catalog"
run = "node scripts/export_pi_catalog.mjs --output dist/pi-model-catalog.json"

[tasks.build]
description = "Build the public catalog and Provider Route artifacts"
depends = ["catalog:export"]
run = "python scripts/build_catalog.py --output-dir dist --pi-catalog dist/pi-model-catalog.json"
